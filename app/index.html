<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Sunset Studio — GTA-style Cover Maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
<h1>VICE SUNSET STUDIO</h1>
<p class="tagline">Turn your photo into GTA-style poster cover art — offline, in your browser.</p>
</header>
<main>
<section class="stage">
<canvas id="preview" width="960" height="640"></canvas>
<p class="hint">Drag a photo onto the canvas or use Upload below.</p>
</section>
<aside class="panel">
<div class="group">
<div class="group-label">Photo</div>
<input type="file" id="photoInput" accept="image/*" multiple>
<div id="sampleStrip">
<button class="sample" data-sample="pier">Sample: Pier</button>
<button class="sample" data-sample="boulevard">Sample: Boulevard</button>
</div>
</div>
<div class="group">
<div class="group-label">Story Preset</div>
<button class="preset-btn" data-preset="heist">🌇 Sunset Heist</button>
<button class="preset-btn" data-preset="neon">🌃 Neon Party</button>
<button class="preset-btn" data-preset="getaway">🚗 Getaway</button>
</div>
<div class="group">
<div class="group-label">Layout</div>
<button class="layout-btn" data-layout="trio">Trio</button>
<button class="layout-btn" data-layout="duo">Duo</button>
<button class="layout-btn" data-layout="solo">Solo</button>
<button class="layout-btn" data-layout="quad">Quad</button>
<button class="layout-btn" data-layout="story">Story (3-act)</button>
</div>
<div class="group">
<div class="group-label">Grade</div>
<button class="grade-btn" data-grade="sunset">Sunset</button>
<button class="grade-btn" data-grade="neon">Neon</button>
<button class="grade-btn" data-grade="golden">Golden Hour</button>
<button class="grade-btn" data-grade="noir">Noir</button>
<button class="grade-btn" data-grade="comic">Comic Ink</button>
</div>
<div class="group">
<div class="group-label">Caption</div>
<input id="titleInput" value="SUNSET HEIST" maxlength="24">
<input id="subtitleInput" value="VICE CITY • 2026" maxlength="40">
<input id="taglineInput" placeholder="Tagline — e.g. ONE LAST JOB" maxlength="32">
<input id="starringInput" placeholder="Starring — e.g. Lucia &amp; Jason" maxlength="40">
</div>
<div class="group">
<div class="group-label">Story</div>
<input id="storyInput" placeholder="Story caption — e.g. It started with a sunset…" maxlength="80">
<input id="bubbleInput" placeholder="Speech bubble — e.g. Run!" maxlength="40">
<button id="letterboxToggle">Letterbox: Off</button>
<button id="shuffleBtn">🎲 Surprise me</button>
</div>
<div class="group">
<div class="group-label">Crop</div>
<input type="range" id="zoomSlider" min="1" max="3" step="0.05" value="1">
<button id="fitFillToggle">Fit / Fill</button>
</div>
<div class="group">
<div class="group-label">Stickers</div>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="palm"> Palm</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="flamingo"> Flamingo</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="sunglasses"> Shades</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="money"> Money bag</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="police"> Police lights</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="car"> Getaway car</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="sun"> Sun</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="cocktail"> Cocktail</label>
<label class="sticker-label"><input type="checkbox" class="sticker-toggle" data-sticker="sign"> Neon sign</label>
</div>
<div class="group">
<div class="group-label">Export PNG</div>
<button id="exportSquare">Square 1080×1080</button>
<button id="exportPortrait">Portrait 1080×1350</button>
<button id="exportWide">Wide 1920×1080</button>
<a id="downloadLink" download="vice-sunset-cover.png">Download the PNG</a>
</div>
</aside>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
